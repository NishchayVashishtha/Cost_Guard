name: Automated Deployment to Kubernetes & OpenShift

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-package:
    name: Run Unit Tests & Build Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute CostGuard Unit & Regression Tests
        run: python -m unittest discover -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: costguard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-kubernetes:
    name: Deploy to Kubernetes Cluster
    needs: test-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Dry Run Kubernetes Manifests Validation
        run: |
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/configmap.yaml
          kubectl apply --dry-run=client -f k8s/deployment.yaml
          kubectl apply --dry-run=client -f k8s/service.yaml
          kubectl apply --dry-run=client -f k8s/ingress.yaml
          kubectl apply --dry-run=client -f k8s/otel-collector.yaml
          echo "[OK] All Kubernetes manifests passed client validation"

  deploy-openshift:
    name: OpenShift GitOps & Route Automation
    needs: test-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenShift Templates
        run: |
          echo "[*] Validating OpenShift Route and BuildConfig specs..."
          grep -q "costguard-devops" openshift/buildconfig.yaml
          grep -q "costguard-route" openshift/route.yaml
          echo "[OK] OpenShift configurations validated successfully"

apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: costguard-route
  namespace: costguard-devops
  labels:
    app: costguard
  annotations:
    openshift.io/host.generated: "true"
spec:
  to:
    kind: Service
    name: costguard-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

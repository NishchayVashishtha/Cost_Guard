apiVersion: v1
kind: Service
metadata:
  name: costguard-service
  namespace: costguard
  labels:
    app: costguard
spec:
  type: ClusterIP
  selector:
    app: costguard
    tier: api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: costguard
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres

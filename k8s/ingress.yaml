apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: costguard-ingress
  namespace: costguard
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  rules:
    - host: costguard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: costguard-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: costguard-hpa
  namespace: costguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: costguard-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

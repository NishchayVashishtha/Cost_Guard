apiVersion: apps/v1
kind: Deployment
metadata:
  name: costguard-api
  namespace: costguard
  labels:
    app: costguard
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: costguard
      tier: api
  template:
    metadata:
      labels:
        app: costguard
        tier: api
    spec:
      containers:
        - name: costguard
          image: ghcr.io/nishchayvashishtha/costguard:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: costguard-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: costguard
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: costguard
            - name: POSTGRES_PASSWORD
              value: costguard
            - name: POSTGRES_DB
              value: costguard
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
